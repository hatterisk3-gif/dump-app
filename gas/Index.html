<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>DUMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* スムーズなスクロールとiOSのタップハイライト消去 */
    html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-850 pb-24 selection:bg-indigo-200">

  <header class="sticky top-0 bg-white border-b border-gray-200 shadow-sm z-40 px-4 py-3 flex justify-between items-center">
    <h1 class="text-xl font-black tracking-wider text-indigo-600 font-mono">DUMP</h1>
    <div id="header-status" class="text-xs text-gray-400 font-medium">Mobile Active</div>
  </header>

  <main class="max-w-md mx-auto p-4">
    
    <div id="input-mode" class="tab-content active bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-md font-bold text-gray-700">INBOX入力</h2>
        <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-mono font-bold">Markdown / Text</span>
      </div>
      <textarea id="input-content" rows="10" class="w-full p-3 border border-gray-300 rounded-lg shadow-inner focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none placeholder-gray-400 font-mono text-sm" placeholder="一時保管する情報をここにダンプ...&#13;&#10;- 箇条書きやURLなど&#13;&#10;- 自由な形式で書き殴れます"></textarea>
      <button onclick="submitInbox()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-xl transition duration-150 text-md shadow-md shadow-indigo-100">INBOXへDUMP</button>
      <p id="input-status" class="text-sm mt-3 text-center font-medium min-h-[20px]"></p>
    </div>

    <div id="organize-mode" class="tab-content bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-md font-bold text-gray-700">INBOXの仕分け</h2>
        <span class="text-xs bg-red-50 text-red-600 px-3 py-1 rounded-full font-bold">残り <span id="remain-count">0</span> 件</span>
      </div>
      <div id="organize-container">
        <div class="bg-gray-900 text-gray-100 p-4 rounded-xl mb-4 min-h-[140px] max-h-[260px] overflow-y-auto whitespace-pre-wrap font-mono text-xs shadow-inner leading-relaxed border border-gray-800" id="current-content"></div>
        <input type="hidden" id="current-id">
        
        <div class="space-y-3 mb-5">
          <div>
            <label class="block text-[11px] font-bold text-gray-400 mb-1 tracking-wide">移動先フォルダ（大分類）</label>
            <select id="select-folder" onchange="onFolderChange()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white text-sm h-12 shadow-sm"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-gray-400 mb-1 tracking-wide">移動先ファイル（小分類）</label>
            <select id="select-file" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white text-sm h-12 shadow-sm"></select>
          </div>
        </div>
        <button onclick="moveItem()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-xl transition duration-150 text-md shadow-md shadow-emerald-100">この場所へ移動して次へ</button>
      </div>
      <div id="organize-empty" class="hidden text-center py-12 text-gray-400 font-medium">
        <span class="text-3xl block mb-2">🎉</span>
        すべての情報が整理されました！
      </div>
    </div>

    <div id="search-mode" class="tab-content bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-md font-bold mb-3 text-gray-700">DUMPデータの検索</h2>
      <div class="flex gap-2 mb-4">
        <input type="text" id="search-keyword" class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm h-12" placeholder="キーワードを入力...">
        <button onclick="executeSearch()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold px-5 rounded-xl transition duration-150 text-sm h-12">検索</button>
      </div>
      <div id="search-results" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
    </div>

    <div id="edit-mode" class="tab-content bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <div class="mb-6 border-b border-gray-200 pb-5">
        <h2 class="text-md font-bold mb-3 text-gray-700">フォルダ・ファイルの編集</h2>
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 mb-4 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="new-folder-name" class="p-2 border border-gray-300 rounded-lg text-xs focus:ring-1 focus:ring-indigo-500" placeholder="フォルダ名">
            <input type="text" id="new-file-name" class="p-2 border border-gray-300 rounded-lg text-xs focus:ring-1 focus:ring-indigo-500" placeholder="ファイル名">
          </div>
          <button onclick="addNewConfig()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2 rounded-lg transition shadow-sm">構成を追加登録</button>
        </div>

        <div class="max-h-[160px] overflow-y-auto border border-gray-200 rounded-lg shadow-inner">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-gray-100 border-b border-gray-200 text-gray-500 font-bold sticky top-0">
                <th class="p-2.5 bg-gray-100">フォルダ</th>
                <th class="p-2.5 bg-gray-100">ファイル</th>
                <th class="p-2.5 text-center bg-gray-100">操作</th>
              </tr>
            </thead>
            <tbody id="config-table-body" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </div>

      <div>
        <h2 class="text-md font-bold mb-3 text-gray-700">登録データのメンテナンス</h2>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <select id="edit-view-folder" onchange="onEditFolderChange()" class="p-2 border border-gray-300 rounded-lg bg-white text-xs h-10"></select>
          <select id="edit-view-file" onchange="loadFolderFileItems()" class="p-2 border border-gray-300 rounded-lg bg-white text-xs h-10"></select>
        </div>
        <div id="edit-file-items" class="space-y-3 max-h-[220px] overflow-y-auto pr-1"></div>
      </div>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-50">
    <div class="max-w-md mx-auto flex justify-around items-center h-16">
      
      <button onclick="switchTab('input-mode')" id="tab-input-mode" class="flex-1 flex flex-col items-center justify-center h-full text-indigo-600 transition duration-155 active:scale-95">
        <span class="text-xl">📥</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-wider">入力</span>
      </button>
      
      <button onclick="switchTab('organize-mode'); loadOrganizeData();" id="tab-organize-mode" class="flex-1 flex flex-col items-center justify-center h-full text-gray-400 transition duration-155 active:scale-95 relative">
        <span class="text-xl">🗂️</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-wider">整理</span>
        <span id="badge-count" class="hidden absolute top-2 right-6 min-w-[16px] h-4 px-1 flex items-center justify-center text-[9px] font-black bg-red-500 text-white rounded-full shadow-sm">0</span>
      </button>
      
      <button onclick="switchTab('search-mode')" id="tab-search-mode" class="flex-1 flex flex-col items-center justify-center h-full text-gray-400 transition duration-155 active:scale-95">
        <span class="text-xl">🔍</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-wider">検索</span>
      </button>
      
      <button onclick="switchTab('edit-mode'); loadEditModeData();" id="tab-edit-mode" class="flex-1 flex flex-col items-center justify-center h-full text-gray-400 transition duration-155 active:scale-95">
        <span class="text-xl">⚙️</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-wider">設定</span>
      </button>
      
    </div>
  </nav>

  <script>
    let configData = {};

    window.onload = function() {
      // スマホではCtrl+Enterがないためボタン主軸だが、PC確認用に残す
      document.getElementById('input-content').addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitInbox();
      });
      updateBadge();
    };

    // ボトムバー専用のタブアクティブ切り替え関数
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      
      document.querySelectorAll('nav button').forEach(el => {
        if(el.id && el.id.startsWith('tab-')) {
          el.classList.remove('text-indigo-600');
          el.classList.add('text-gray-400');
        }
      });
      const activeTab = document.getElementById('tab-' + tabId);
      activeTab.classList.remove('text-gray-400');
      activeTab.classList.add('text-indigo-600');
      
      window.scrollTo(0, 0); // 切り替え時に画面トップへ
    }

    function updateBadge() {
      google.script.run.withSuccessHandler(function(data) {
        const badge = document.getElementById('badge-count');
        if(data.count > 0) {
          badge.textContent = data.count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }).getOrganizerData();
    }

    // 【入力】送信
    function submitInbox() {
      const textarea = document.getElementById('input-content');
      const status = document.getElementById('input-status');
      const content = textarea.value;
      if(!content.trim()) return;

      status.textContent = "⚡ INBOXにダンプ中...";
      status.className = "text-sm mt-3 text-center text-gray-400";

      google.script.run.withSuccessHandler(function(success) {
        if(success) {
          textarea.value = "";
          status.textContent = "✓ 正常にダンプされました";
          status.className = "text-sm mt-3 text-center text-emerald-600 font-bold";
          updateBadge();
          setTimeout(() => { status.textContent = ""; }, 3000);
        }
      }).addInbox(content);
    }

    // 【整理】データ取得
    function loadOrganizeData() {
      google.script.run.withSuccessHandler(function(data) {
        configData = data.config;
        renderOrganizer(data);
      }).getOrganizerData();
    }

    function renderOrganizer(data) {
      document.getElementById('remain-count').textContent = data.count;
      document.getElementById('badge-count').textContent = data.count;
      if(data.count > 0) document.getElementById('badge-count').classList.remove('hidden');
      else document.getElementById('badge-count').classList.add('hidden');

      if (data.count === 0) {
        document.getElementById('organize-container').classList.add('hidden');
        document.getElementById('organize-empty').classList.remove('hidden');
        return;
      }

      document.getElementById('organize-container').classList.remove('hidden');
      document.getElementById('organize-empty').classList.add('hidden');
      
      document.getElementById('current-content').textContent = data.nextItem.content;
      document.getElementById('current-id').value = data.nextItem.id;

      const folderSelect = document.getElementById('select-folder');
      const cachedFolder = folderSelect.value;
      folderSelect.innerHTML = '';
      
      Object.keys(configData).forEach(folder => {
        const opt = document.createElement('option');
        opt.value = folder; opt.textContent = folder;
        folderSelect.appendChild(opt);
      });

      if(cachedFolder && configData[cachedFolder]) folderSelect.value = cachedFolder;
      onFolderChange();
    }

    function onFolderChange() {
      const folderSelect = document.getElementById('select-folder');
      const fileSelect = document.getElementById('select-file');
      const selectedFolder = folderSelect.value;
      
      fileSelect.innerHTML = '';
      if(configData[selectedFolder]) {
        configData[selectedFolder].forEach(file => {
          const opt = document.createElement('option');
          opt.value = file; opt.textContent = file;
          fileSelect.appendChild(opt);
        });
      }
    }

    // 【整理】移動
    function moveItem() {
      const id = document.getElementById('current-id').value;
      const folder = document.getElementById('select-folder').value;
      const file = document.getElementById('select-file').value;
      if(!id || !folder || !file) return;

      google.script.run.withSuccessHandler(function(updatedData) {
        renderOrganizer(updatedData);
      }).moveInboxItem(id, folder, file);
    }

    // 【検索】実行
    function executeSearch() {
      const keyword = document.getElementById('search-keyword').value;
      const resultsContainer = document.getElementById('search-results');
      if(!keyword.trim()) return;

      resultsContainer.innerHTML = '<div class="text-center text-gray-400 py-4 text-xs">検索中...</div>';

      google.script.run.withSuccessHandler(function(results) {
        resultsContainer.innerHTML = '';
        if(results.length === 0) {
          resultsContainer.innerHTML = '<div class="text-center text-gray-400 py-4 text-xs">該当データなし</div>';
          return;
        }
        results.forEach(item => {
          const div = document.createElement('div');
          div.className = "p-3 border border-gray-200 rounded-xl bg-gray-50 text-xs";
          div.innerHTML = `
            <div class="flex justify-between items-center mb-1.5">
              <div>
                <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 font-bold rounded-md mr-1">${item.folder}</span>
                <span class="px-2 py-0.5 bg-gray-200 text-gray-700 font-bold rounded-md">${item.file}</span>
              </div>
              <span class="text-[10px] text-gray-400 font-mono">${item.timestamp}</span>
            </div>
            <div class="whitespace-pre-wrap font-mono mt-1 bg-white p-2.5 border border-gray-100 rounded-lg shadow-inner text-gray-700 leading-relaxed">${item.content}</div>
          `;
          resultsContainer.appendChild(div);
        });
      }).searchItems(keyword);
    }

    // 【設定】管理画面データのロード
    function loadEditModeData() {
      google.script.run.withSuccessHandler(function(list) {
        const tbody = document.getElementById('config-table-body');
        tbody.innerHTML = '';
        list.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 border-b border-gray-100";
          tr.innerHTML = `
            <td class="p-2.5 text-gray-700 font-medium">${item.folder}</td>
            <td class="p-2.5 text-gray-600">${item.file}</td>
            <td class="p-2.5 text-center space-x-2">
              <button onclick="renameConfig('${item.folder}', '${item.file}')" class="text-indigo-600 hover:text-indigo-900 font-bold">変更</button>
              <button onclick="deleteConfig('${item.folder}', '${item.file}')" class="text-red-500 hover:text-red-900 font-bold">削除</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }).getConfigList();

      google.script.run.withSuccessHandler(function(data) {
        configData = data.config;
        const folderSelect = document.getElementById('edit-view-folder');
        const cachedFolder = folderSelect.value;
        folderSelect.innerHTML = '';
        
        Object.keys(configData).forEach(folder => {
          const opt = document.createElement('option');
          opt.value = folder; opt.textContent = folder;
          folderSelect.appendChild(opt);
        });
        if(cachedFolder && configData[cachedFolder]) folderSelect.value = cachedFolder;
        onEditFolderChange();
      }).getOrganizerData();
    }

    function addNewConfig() {
      const folderInput = document.getElementById('new-folder-name');
      const fileInput = document.getElementById('new-file-name');
      const f = folderInput.value;
      const file = fileInput.value;
      if(!f.trim() || !file.trim()) return;

      google.script.run.withSuccessHandler(function(success) {
        if(success) {
          folderInput.value = '';
          fileInput.value = '';
          loadEditModeData();
        }
      }).addConfigRecord(f, file);
    }

    function deleteConfig(folder, file) {
      if(!confirm(`「${folder} ＞ ${file}」のマスタを削除しますか？`)) return;
      google.script.run.withSuccessHandler(function() {
        loadEditModeData();
      }).deleteConfigRecord(folder, file);
    }

    function renameConfig(oldFolder, oldFile) {
      const newFolder = prompt(`新しいフォルダ名:`, oldFolder);
      if(newFolder === null) return;
      const newFile = prompt(`新しいファイル名:`, oldFile);
      if(newFile === null) return;

      if(!newFolder.trim() || !newFile.trim()) return;

      google.script.run.withSuccessHandler(function(success) {
        if(success) loadEditModeData();
      }).updateConfigRecord(oldFolder, oldFile, newFolder, newFile);
    }

    function onEditFolderChange() {
      const folderSelect = document.getElementById('edit-view-folder');
      const fileSelect = document.getElementById('edit-view-file');
      const selectedFolder = folderSelect.value;
      
      fileSelect.innerHTML = '';
      if(configData[selectedFolder]) {
        configData[selectedFolder].forEach(file => {
          const opt = document.createElement('option');
          opt.value = file; opt.textContent = file;
          fileSelect.appendChild(opt);
        });
      }
      loadFolderFileItems();
    }

    function loadFolderFileItems() {
      const folder = document.getElementById('edit-view-folder').value;
      const file = document.getElementById('edit-view-file').value;
      const container = document.getElementById('edit-file-items');
      
      if(!folder || !file) {
        container.innerHTML = '<div class="text-center text-gray-400 py-4 text-xs">データなし</div>';
        return;
      }

      google.script.run.withSuccessHandler(function(items) {
        container.innerHTML = '';
        if(items.length === 0) {
          container.innerHTML = '<div class="text-center text-gray-400 py-4 text-xs">データ空っぽです</div>';
          return;
        }
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = "p-2.5 border border-gray-200 rounded-lg bg-gray-50 text-xs flex justify-between items-start gap-2 shadow-inner";
          div.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="text-[9px] text-gray-400 font-mono">${item.timestamp}</span>
              <div class="whitespace-pre-wrap font-mono mt-0.5 text-gray-700 leading-relaxed">${item.content}</div>
            </div>
            <button onclick="deleteData('${item.id}')" class="text-red-500 font-bold shrink-0 p-1">削除</button>
          `;
          container.appendChild(div);
        });
      }).getFolderFileItems(folder, file);
    }

    function deleteData(id) {
      if(!confirm("このデータを完全に削除しますか？")) return;
      google.script.run.withSuccessHandler(function(success) {
        if(success) loadFolderFileItems();
      }).deleteDataRecord(id);
    }
  </script>
</body>
</html>
